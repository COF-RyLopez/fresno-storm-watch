name: Verify and deploy Storm Watch
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
concurrency:
  group: storm-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.3'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - name: Check private publisher contract without connecting to ArcGIS
        run: python3 -m unittest discover -s tests -p 'test_eoc_publisher.py'
      - name: Check private pump refresh and inactive Notebook without connecting to ArcGIS
        run: python3 -m unittest discover -s tests -p 'test_pump_refresh.py'
      - name: Check county network-attribute accounting offline
        run: python3 -m unittest discover -s tests -p 'test_county_waterways.py'
      - name: Check irrigation source-audit semantics offline
        run: python3 -m unittest discover -s tests -p 'test_irrigation_audit.py'
      - name: Validate private exposure format and conflation with synthetic data
        run: |
          python3 -m venv work/exposure-env
          work/exposure-env/bin/python -m pip install --disable-pip-version-check -r scripts/exposure-requirements.txt
          work/exposure-env/bin/python -m unittest discover -s tests -p 'test_building_conflation.py'
          work/exposure-env/bin/python -m pip install --disable-pip-version-check -r scripts/building-requirements.txt
          work/exposure-env/bin/python -m unittest discover -s tests -p 'test_power_buildings.py'
      - name: Collect public CDEC reservoir readings
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npm run collect:reservoirs -- --published
      - name: Collect public county sandbag references
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npm run collect:sandbags -- --published
      - name: Collect public PG&E and SCE power records
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npm run collect:power -- --published
      - name: Refresh public utility network references when daily check is due
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npm run collect:power-network -- --published
      - name: Collect public NWS wind and gust forecasts
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npm run collect:wind -- --published
      - name: Collect county Waze partner reports (skips without the secret; publishes only when WAZE_PUBLISH is 'true')
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          WAZE_FEED_URL: ${{ secrets.WAZE_FEED_URL }}
          WAZE_PUBLISH: ${{ vars.WAZE_PUBLISH }}
        run: npm run collect:waze -- --published
      - name: Prepare regional public HRRR winds and gusts
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        timeout-minutes: 8
        run: |
          python3 -m venv work/hrrr-env
          work/hrrr-env/bin/python -m pip install --disable-pip-version-check -r scripts/hrrr-requirements.txt
          work/hrrr-env/bin/python -m unittest discover -s tests -p 'test_hrrr_collector.py'
          work/hrrr-env/bin/python scripts/collect-hrrr.py
      - name: Collect public NWS and Dynamical river-area comparisons
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npm run collect:comparisons
      - name: Collect shared public MapLibre and ArcGIS pilot inputs
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npm run collect:map-pilot
      - name: Collect public NWS Hanford briefing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npm run collect:briefing -- --published
      - name: Collect public WPC rainfall-probability map images
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npm run collect:probability
      - name: Render public briefing page previews
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          python3 -m venv work/briefing-render-env
          work/briefing-render-env/bin/python -m pip install --disable-pip-version-check -r scripts/briefing-render-requirements.txt
          work/briefing-render-env/bin/python scripts/render-briefing.py
          work/briefing-render-env/bin/python -m unittest discover -s tests -p 'test_briefing_renderer.py'
          node --test tests/briefing.test.mjs tests/briefing-impacts.test.mjs tests/briefing-context.test.mjs
      - name: Write the public Google Map Tiles browser key (skipped until the GOOGLE_MAP_TILES_KEY variable exists)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.GOOGLE_MAP_TILES_KEY != ''
        env:
          # A browser key is public by design; Google Cloud API and website restrictions are what protect it.
          GOOGLE_MAP_TILES_KEY: ${{ vars.GOOGLE_MAP_TILES_KEY }}
        run: node -e "const k=process.env.GOOGLE_MAP_TILES_KEY.trim();if(!/^[A-Za-z0-9_-]{20,100}$/.test(k))throw new Error('GOOGLE_MAP_TILES_KEY is not an API key');require('fs').writeFileSync('site/data/google-tiles.json',JSON.stringify({key:k}))"
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload public site only
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
