name: Verify and deploy Storm Watch
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
concurrency:
  group: storm-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.3'
      - run: npm test
      - run: npm run check
      - name: Check private publisher contract without connecting to ArcGIS
        run: python3 -m unittest discover -s tests -p 'test_eoc_publisher.py'
      - name: Collect public CDEC reservoir readings
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npm run collect:reservoirs -- --published
      - name: Collect public PG&E and SCE power records
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npm run collect:power -- --published
      - name: Collect public NWS wind and gust forecasts
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npm run collect:wind -- --published
      - name: Collect public NWS Hanford briefing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npm run collect:briefing -- --published
      - name: Render public briefing page previews
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          python3 -m venv work/briefing-render-env
          work/briefing-render-env/bin/python -m pip install --disable-pip-version-check -r scripts/briefing-render-requirements.txt
          work/briefing-render-env/bin/python scripts/render-briefing.py
          work/briefing-render-env/bin/python -m unittest discover -s tests -p 'test_briefing_renderer.py'
          node --test tests/briefing.test.mjs tests/briefing-impacts.test.mjs
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload public site only
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
